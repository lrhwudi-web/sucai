{% extends "base.html" %}
{% block content %}
<section class="login-page">
  <div class="login-copy">
    <span class="brand-mark large">CRAFTSMAN GOLF</span>
    <h1>Product Material Index</h1>
    <p>Unified product images, videos, KOL/UGC assets, and controlled downloads from Google Drive.</p>
  </div>
  <form method="post" action="/login" class="login-card">
    <h2>Sign in</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label>Email <input name="email" type="email" required autofocus></label>
    <label>Password <input name="password" type="password" required></label>
    <button class="button primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
